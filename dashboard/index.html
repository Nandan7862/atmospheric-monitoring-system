<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmospheric Monitoring Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        blob: 'blob 7s infinite',
                        shake: 'shake 0.5s ease-in-out',
                        'fade-in-down': 'fade-in-down 0.8s ease-out forwards',
                        'pulse-slow': 'pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' },
                        },
                        'fade-in-down': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(-20px)',
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)',
                            },
                        },
                    },
                },
            },
        }
    </script>
<script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1"
  }
}
</script>
<style>
    /* Custom premium scrollbar for Webkit browsers */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    .dark ::-webkit-scrollbar-thumb {
        background-color: rgba(30, 41, 59, 0.5); /* slate-800/50 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(30, 41, 59, 0.8); /* slate-800/80 */
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
        background-color: rgba(100, 116, 139, 0.5); /* slate-500/50 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 116, 139, 0.8); /* slate-500/80 */
    }
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-100 dark:bg-[#050816] font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
